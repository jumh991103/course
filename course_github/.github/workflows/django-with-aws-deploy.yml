# "Test (Django with aws)" 워크플로우가 main 브랜치에서 성공했을 때만 실행되는 배포 워크플로우
name: Deploy (Django with aws)

on:
  # 다른 워크플로우(CI)가 끝났을 때 트리거
  workflow_run:
    # 이 이름은 django-with-aws-test.yml의 name과 정확히 일치해야 함
    workflows: ["Test (Django with aws)"]
    # 성공/실패 여부와 관계없이 "완료"되면 일단 트리거됨 (성공 여부는 jobs.deploy.if에서 다시 확인)
    types: [completed]
    # main 브랜치에서 실행된 CI만 대상
    branches: ["main"]

jobs:
  deploy:
    # CI 워크플로우가 성공했을 때만 배포 진행 (실패 시 배포 건너뜀)
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 체크아웃
        uses: actions/checkout@v4

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Dockerfile이 위치한 예제 폴더를 빌드 컨텍스트로 지정해 이미지 빌드 후 Docker Hub에 푸시
      - name: 이미지 빌드 & Docker Hub 푸시
        uses: docker/build-push-action@v5
        with:
          context: "Github Actions/Django with aws"
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/django-web:latest

      # EC2에 SSH로 접속해 최신 이미지를 받아 컨테이너를 재시작
      - name: EC2 재배포
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/django-web:latest
            docker stop django-server || true
            docker rm django-server || true
            docker run -d --name django-server -p 80:80 ${{ secrets.DOCKERHUB_USERNAME }}/django-web:latest
