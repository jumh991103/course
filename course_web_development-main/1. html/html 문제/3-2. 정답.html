<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>회원가입 폼</title>
</head>
<body>
  <form action="#" method="post">
    <fieldset>
      <legend>회원가입</legend>

      <label for="name">이름:</label>
      <input id="name" name="name" type="text" required placeholder="홍길동">

      <br><br>

      <label for="email">이메일:</label>
      <input id="email" name="email" type="email" required placeholder="example@example.com">

      <br><br>

      <label for="password">비밀번호:</label>
      <input id="password" name="password" type="password" required minlength="8" placeholder="최소 8자 이상">

      <br><br>

      <button type="submit">회원가입</button>
    </fieldset>
  </form>
</body>
</html>
