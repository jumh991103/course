<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>시간표</title>
  <!-- Flexbox 스타일시트 연결 -->
  <link rel="stylesheet" href="1-3. styles.css">
</head>
<body>
  <table>
    <caption>1주차 시간표</caption>
    <thead>
      <tr>
        <th scope="col">시간</th>
        <th scope="col">월요일</th>
        <th scope="col">화요일</th>
        <th scope="col">수요일</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <th scope="row">09:00 - 10:30</th>
        <td>수학</td>
        <td>영어</td>
        <td>과학</td>
      </tr>
      <tr>
        <th scope="row">10:40 - 12:10</th>
        <td>국어</td>
        <td>프로그래밍</td>
        <td>체육</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
