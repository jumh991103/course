<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>시간표</title>
  <!-- CSS 파일 연결 -->
  <link rel="stylesheet" href="1-3. styles.css">
</head>
<body>
  <!-- 버튼 영역 -->
  <div class="button-group">
    <button id="addRow">행 추가</button>
    <button id="addCol">열 추가</button>
    <button id="clearCell">선택한 셀 지우기</button>
  </div>

  <!-- 시간표 -->
  <table>
    <caption>1주차 시간표</caption>
    <thead>
      <tr>
        <th scope="col">시간</th>
        <th scope="col">월요일</th>
        <th scope="col">화요일</th>
        <th scope="col">수요일</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <th scope="row">09:00 - 10:30</th>
        <td>수학</td>
        <td>영어</td>
        <td>과학</td>
      </tr>
      <tr>
        <th scope="row">10:40 - 12:10</th>
        <td>국어</td>
        <td>프로그래밍</td>
        <td>체육</td>
      </tr>
    </tbody>
  </table>

  <!-- JS 파일 연결 -->
  <script src="1-4. timetable.js"></script>
</body>
</html>
