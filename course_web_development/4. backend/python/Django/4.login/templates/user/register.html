<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/register.css' %}">
</head>
<body>
    <div class="wrapper">
        <h2>Register Page</h2>
        <br>

        {% if messages %}
            {% for message in messages %}
                <p style="color:red">{{message}}</p>
            {% endfor %}
        {% endif %}

        <!-- http://localhost:8000/user/register/ -->
        <form method="POST" action="{% url 'req-register' %}">
            {% csrf_token %}
            <div class="input-box">
                <input type="text" placeholder="Create a username" required name="username">
            </div>
            <div class="input-box">
                <input type="password" placeholder="Create a password" required name="password">
            </div>
            <div class="input-box">
                <input type="email" placeholder="Enter your email" name="email">
            </div>
            <div class="input-box button">
                <!-- submit button 클릭시, username & password & (옵션) email를 서버로 전달  -->
                <input type="submit" value="Register">
            </div>
        </form>
        <div class="text">
            <h3>
                Do you have an account?
                <a href="{% url 'user-login' %}">Login Now</a>
            </h3>
        </div>
    </div>
</body>
</html>
